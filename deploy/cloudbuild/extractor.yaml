# Build + push the gfmrag extractor image inside GCP — no local Docker needed,
# and no 10GB image upload from a dev machine.
#
# Invoke from the repo root (terraform prints the exact command):
#   gcloud builds submit --config deploy/cloudbuild/extractor.yaml \
#     --substitutions _IMAGE=<region>-docker.pkg.dev/<project>/gfmrag/extractor:latest .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/docker/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]

# poetry resolving CUDA torch + faiss is heavy: default builder/timeout won't cut it.
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
