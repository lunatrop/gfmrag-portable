# Build + push the gfmrag QA serving image inside GCP.
#
# Invoke from the repo root (terraform prints the exact command):
#   gcloud builds submit --config deploy/cloudbuild/serve.yaml \
#     --substitutions _IMAGE=<region>-docker.pkg.dev/<project>/gfmrag/gfmrag-qa:latest .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/docker/Dockerfile.serve", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]

timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
