# Prompt profile: Australian Modern Slavery Register corpus.
#
# Targets the measured 3B weaknesses (corpus-tuples/ladder-results.md):
# ABN recall 41-56% (joint statements shed parenthetical ABNs) and fragmented
# relations (filed/with/for). ABN triples are ordered FIRST in the one-shot so
# output-length truncation drops repeated attributes, not identifiers.
#
# Deploy: copy as raw/prompts.yaml beside the dataset's documents.json —
# KGConstructor auto-applies it (see gfmrag/graph_index_construction/prompt_profiles.py).

ner_instruction: |
  Your task is to extract named entities from the given paragraph.
  Include organisations, identification numbers (e.g. ABN/ACN — extract them exactly as written), places, dates and reporting periods, industry sectors, revenue bands, and URLs.
  Respond with a JSON list of entities.
  Strictly follow the required JSON format.

openie_instruction: |
  Your task is to construct an RDF (Resource Description Framework) graph from the given passages and named entity lists.
  Respond with a JSON list of triples, with each triple representing a relationship in the RDF graph.

  Pay attention to the following requirements:
  - Each triple should contain at least one, but preferably two, of the named entities in the list for each passage.
  - Every identification number (e.g. ABN) must appear in exactly one triple of the form [entity, "has ABN", number]. Output these triples first.
  - When several entities act jointly, create the relationship triple for each pair in both directions, and repeat shared attributes (reporting period, headquarters, revenue band, sectors) for EVERY entity.
  - Clearly resolve pronouns to their specific names to maintain clarity.

one_shot:
  passage: |
    ACME FOODS PTY LTD (ABN 11 222 333 444) and ACME HOLDINGS LIMITED (ABN 55 666 777 888) filed a joint modern slavery statement with the Australian Modern Slavery Register for the reporting period 2022-07-01 to 2023-06-30. The reporting entities are headquartered in Australia. The reporting entities have an annual revenue band of 1BN+. The reporting entities operate in the industry sectors: Food and beverages, agriculture and fishing. The statement also covers the included entities: ACME FARMS PTY LTD (99 888 777 666).
  entities:
    - "ACME FOODS PTY LTD"
    - "ABN 11 222 333 444"
    - "ACME HOLDINGS LIMITED"
    - "ABN 55 666 777 888"
    - "Australian Modern Slavery Register"
    - "2022-07-01 to 2023-06-30"
    - "Australia"
    - "1BN+"
    - "Food and beverages, agriculture and fishing"
    - "ACME FARMS PTY LTD"
    - "ABN 99 888 777 666"
  triples:
    - ["ACME FOODS PTY LTD", "has ABN", "11 222 333 444"]
    - ["ACME HOLDINGS LIMITED", "has ABN", "55 666 777 888"]
    - ["ACME FARMS PTY LTD", "has ABN", "99 888 777 666"]
    - ["ACME FOODS PTY LTD", "filed joint modern slavery statement with", "ACME HOLDINGS LIMITED"]
    - ["ACME HOLDINGS LIMITED", "filed joint modern slavery statement with", "ACME FOODS PTY LTD"]
    - ["ACME FOODS PTY LTD", "covers reporting period", "2022-07-01 to 2023-06-30"]
    - ["ACME HOLDINGS LIMITED", "covers reporting period", "2022-07-01 to 2023-06-30"]
    - ["ACME FOODS PTY LTD", "headquartered in", "Australia"]
    - ["ACME HOLDINGS LIMITED", "headquartered in", "Australia"]
    - ["ACME FOODS PTY LTD", "has annual revenue band", "1BN+"]
    - ["ACME HOLDINGS LIMITED", "has annual revenue band", "1BN+"]
    - ["ACME FOODS PTY LTD", "operates in sector", "Food and beverages, agriculture and fishing"]
    - ["ACME HOLDINGS LIMITED", "operates in sector", "Food and beverages, agriculture and fishing"]
    - ["ACME FOODS PTY LTD", "includes entity", "ACME FARMS PTY LTD"]
    - ["ACME HOLDINGS LIMITED", "includes entity", "ACME FARMS PTY LTD"]
