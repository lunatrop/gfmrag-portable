# Local OpenIE via Ollama + qwen2.5:3b — the local default. Select with
#   openie_model=ollama_qwen
# The default (llm_openie_model.yaml) still targets OpenAI gpt-4o-mini.
# Requires a local Ollama server (OLLAMA_HOST, default 127.0.0.1:11434) with the
# model pulled: `ollama pull qwen2.5:3b`. Thinking is disabled automatically.
# (Replaces gemma2:2b as default: gemma emits 0 triples on register-style text —
# see corpus-tuples/smoke-test-2026-06-10.md.)
_target_: gfmrag.graph_index_construction.openie_model.LLMOPENIEModel
llm_api: ollama
model_name: qwen2.5:3b
max_ner_tokens: 300
max_triples_tokens: 4096
